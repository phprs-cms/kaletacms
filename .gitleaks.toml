# Gitleaks: výchozí pravidla + výjimka pro smyšlené klíče, kterými testy krmí falešný server Stripe (tools/test.sh, tools/fixtures/).
# Skutečný klíč sem nikdy nepatří – výjimka je úmyslně jen na tento jeden vymyšlený řetězec.
title = "Kaleta"

[extend]
useDefault = true

[allowlist]
description = "made-up test values: a Stripe key for the offline tests, the public TOTP test vector of RFC 6238, the password of the intruder account the demo test tries to create (tools/test-demo.sh), the Claude tokens of the security hygiene test, the password with spaces of the 3.3.3 sign-in test (tools/test.sh), the wrong visit-beacon key of the 3.29 statistics test (tools/test.sh)"
regexes = ['''sk_test_NahrazkaKlice0+''', '''GEZDGNBVGY3TQOJQGEZDGNBVGY3TQOJQ''', '''Intruder-2026-x''', '''hygiene-(live|old|unused)''', '''Mezera-heslo-123''', '''0123456789abcdef0123456789abcdef''']
