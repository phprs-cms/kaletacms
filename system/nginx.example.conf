# Kaleta – example configuration for nginx.
#
# On Apache, the shipped .htaccess files do all of this. Nginx does not read them, so WITHOUT these rules files that must
# not be public (config.php, storage/, system/) could be downloaded from the site. Check it after deploying: the addresses
# /config.php, /system/sql/schema.sql and /storage/log/chyby.log must return 403 or 404.
#
# NOTE: test it with `nginx -t` before deploying.
#
# 1) Into the http { … } block (outside server), add the maps for WebP and AVIF – without them nginx does not start
#    because of an unknown variable:
#      map $http_accept $webp_suffix { default ""; "~*image/webp" ".webp"; }
#      map $http_accept $avif_suffix { default ""; "~*image/avif" ".avif"; }
# 2) Put the rest into the server { … } block of your site and adjust the path to PHP-FPM.

index index.php;
charset utf-8;

# 1) files and folders that must not be reachable from the web
location ~ ^/(config(\.sample)?\.php|system|storage|tools|docs|dist)(/|$) { return 403; }
location ^~ /.well-known/                                                  { try_files $uri /index.php$is_args$args; } # HTTPS certificate, OAuth metadata
location ~ /\.                                                             { return 403; }   # .git, .htaccess, .env…
location ~ ^/layout/.+\.php$                                               { return 403; }   # layouts of older releases never run directly
location ~ ^/extensions/(?![^/]+/public/)                                  { return 403; }   # add-ons: only their public/ folder (3.9.2, as .htaccess since 3.3.2)

# 2) uploaded files are never run as PHP, and attachments are downloaded, not opened
location ^~ /media/ {
    location ~* \.(php\d?|pht|phtml|phar|pl|py|cgi|sh|shtml|html?|js)(\.|$) { return 403; } # also x.php.jpg (3.9.2)
    # SVG from Media is cleaned; a strict CSP is the second safeguard
    location ~* \.svg$ { add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src data:; sandbox" always; add_header X-Content-Type-Options nosniff always; }
    location ~* \.(docx?|xlsx?|pptx?|od[tsp]|rtf|csv|zip|epub|gpx|ics)$ { add_header Content-Disposition attachment always; add_header X-Content-Type-Options nosniff always; }
    add_header X-Content-Type-Options nosniff always;
    # the AVIF or WebP sibling when the browser accepts it and the file exists (photo.jpg -> photo.jpg.webp)
    location ~ \.(jpe?g|png)$ {
        add_header Vary Accept always;
        try_files $uri$avif_suffix $uri$webp_suffix $uri =404;
        expires 30d;
    }
    expires 30d;
}

# 3) static files with a long lifetime (their URLs carry ?v=version)
location ~ ^/(image|layout)/.+\.(css|js|png|jpe?g|gif|svg|webp|ico|woff2?)$ { expires 30d; access_log off; }

# 4) everything else goes to index.php (pretty URLs); admin.php and install.php are called directly
location / { try_files $uri $uri/ /index.php?$query_string; }

location ~ ^/(index|admin|install)\.php$ {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param HTTP_AUTHORIZATION $http_authorization;   # tokens of the Claude connection (MCP)
    fastcgi_pass unix:/run/php/php8.4-fpm.sock;             # adjust to your server
}
location ~ \.php$ { return 404; }                            # no other PHP files run from the web

# Upload size: client_max_body_size 64m; (and a matching upload_max_filesize in PHP)
