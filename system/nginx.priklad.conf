# MiroCMS - ukázková konfigurace pro nginx.
#
# Na Apache tohle všechno zařídí dodané soubory .htaccess. Nginx je nečte, takže BEZ těchto pravidel
# by šly z webu stáhnout soubory, které veřejné být nemají (config.php, storage/, system/). Po nasazení
# si to ověřte: adresy /config.php, /system/sql/schema.sql a /storage/log/chyby.log musí vracet 403 nebo 404.
#
# POZOR: ukázka nebyla ověřena na běžícím nginx – před nasazením spusťte `nginx -t`.
#
# 1) Do bloku http { … } (mimo server) přidejte mapu pro WebP – bez ní nginx kvůli neznámé proměnné nenastartuje:
#      map $http_accept $webp_pripona { default ""; "~*image/webp" ".webp"; }
#      map $http_accept $avif_pripona { default ""; "~*image/avif" ".avif"; }
# 2) Zbytek vložte do bloku server { … } svého webu a upravte cestu k PHP-FPM.

index index.php;
charset utf-8;

# 1) soubory a složky, které z webu dostupné být nesmí
location ~ ^/(config(\.sample)?\.php|system|storage|tools|docs|dist)(/|$) { return 403; }
location ~ /\.                                                             { return 403; }   # .git, .htaccess, .env…
location ~ ^/layout/.+\.php$                                               { return 403; }   # šablony se nespouštějí přímo

# 2) nahrané soubory se nikdy nespouštějí jako PHP a přílohy se stahují, neotevírají
location ^~ /media/ {
    location ~* \.(php\d?|phtml|phar|pl|py|cgi|sh|html?|js)$ { return 403; }
    # SVG z Médií je vyčištěné; přísná CSP je druhá pojistka
    location ~* \.svg$ { add_header Content-Security-Policy "default-src 'none'; style-src 'unsafe-inline'; img-src data:; sandbox" always; add_header X-Content-Type-Options nosniff always; }
    location ~* \.(docx?|xlsx?|pptx?|od[tsp]|rtf|csv|zip|epub|gpx|ics)$ { add_header Content-Disposition attachment always; add_header X-Content-Type-Options nosniff always; }
    add_header X-Content-Type-Options nosniff always;
    # WebP varianta, když ji prohlížeč umí a soubor existuje (foto.jpg -> foto.jpg.webp)
    location ~ \.(jpe?g|png)$ {
        add_header Vary Accept always;
        try_files $uri$avif_pripona $uri$webp_pripona $uri =404;
        expires 30d;
    }
    expires 30d;
}

# 3) statické soubory s dlouhou platností (adresy nesou ?v=verze)
location ~ ^/(image|layout)/.+\.(css|js|png|jpe?g|gif|svg|webp|ico|woff2?)$ { expires 30d; access_log off; }

# 4) vše ostatní obslouží index.php (hezké adresy); admin.php a install.php se volají přímo
location / { try_files $uri $uri/ /index.php?$query_string; }

location ~ ^/(index|admin|install)\.php$ {
    include fastcgi_params;
    fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    fastcgi_param HTTP_AUTHORIZATION $http_authorization;   # tokeny napojení na Claude (MCP) a API
    fastcgi_pass unix:/run/php/php8.4-fpm.sock;             # upravte podle svého serveru
}
location ~ \.php$ { return 404; }                            # žádné jiné PHP soubory se z webu nespouštějí

# Velikost nahrávaných souborů: client_max_body_size 64m; (a odpovídající upload_max_filesize v PHP)
