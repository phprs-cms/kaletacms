# Kontrola každé změny: syntaxe a kouřový test na podporovaných verzích PHP, bezpečnostní statická analýza,
# hlídání tajemství v repozitáři. Jednou týdně běží i bez změn - odhalí problém s novou verzí PHP nebo MySQL.
name: Kontrola
on:
  push:
  pull_request:
  schedule:
    - cron: '17 4 * * 1'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.4', '8.5']
    services:
      mysql:
        image: mysql:8.4
        env: { MYSQL_ROOT_PASSWORD: root }
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@v7
      - uses: shivammathur/setup-php@v2
        with: { php-version: '${{ matrix.php }}', extensions: 'pdo_mysql, mbstring, gd, zip, sodium, intl, exif', coverage: none }
      - name: Kouřový test (čistá instalace a průchod stránkami)
        run: tools/test.sh
        env: { DB_HOST: 127.0.0.1, DB_USER: root, DB_PASS: root }
      - name: Anglická administrace bez češtiny
        run: tools/test-english.sh
        env: { DB_HOST: 127.0.0.1, DB_USER: root, DB_PASS: root }
  migrace:
    # aktualizace databáze starší verze na současnou (tools/test-migrace.sh) na MySQL i MariaDB, jaké mívají hostingy
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        db:
          - { image: 'mysql:8.4', health: 'mysqladmin ping -proot' }
          - { image: 'mariadb:10.6', health: 'healthcheck.sh --connect --innodb_initialized' }
          - { image: 'mariadb:11.4', health: 'healthcheck.sh --connect --innodb_initialized' }
    services:
      db:
        image: ${{ matrix.db.image }}
        env: { MYSQL_ROOT_PASSWORD: root, MARIADB_ROOT_PASSWORD: root }
        ports: ['3306:3306']
        options: --health-cmd="${{ matrix.db.health }}" --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: shivammathur/setup-php@v2
        with: { php-version: '8.4', extensions: 'pdo_mysql, mbstring, intl, sodium', coverage: none }
      - name: Aktualizace databáze z 1.0.0 na současnou verzi
        run: tools/test-migrace.sh
        env: { DB_HOST: 127.0.0.1, DB_USER: root, DB_PASS: root, FROM: v1.0.0 }
  bezpecnost:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Semgrep - bezpečnostní pravidla pro PHP a JavaScript
        uses: returntocorp/semgrep-action@v1
        with: { config: 'p/php p/javascript p/secrets p/owasp-top-ten' }
      - name: Gitleaks - v repozitáři nesmí být klíče ani hesla
        # přímo program: hotová akce gitleaks-action chce u organizací placenou licenci
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:latest detect --source /repo --redact --no-banner
      - name: Soukromý klíč vydavatele není v gitu
        run: '! git ls-files | grep -E "tools/klice|\.key$"'
