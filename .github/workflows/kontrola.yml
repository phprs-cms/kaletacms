# Kontrola každé změny: syntaxe a kouřový test na podporovaných verzích PHP, bezpečnostní statická analýza,
# hlídání tajemství v repozitáři. Jednou týdně běží i bez změn - odhalí problém s novou verzí PHP nebo MySQL.
name: Kontrola
on:
  push:
  pull_request:
  schedule:
    - cron: '17 4 * * 1'
permissions:
  contents: read
jobs:
  test:
    # 3.43 B (Q12, step 2): every suite is its own job – a flaky suite re-runs alone and the suites run side by side. Each job
    # starts from a clean runner with its own MySQL; what used to run in one job per PHP version still runs on the same versions:
    # smoke, English, demo and browser on 8.3/8.4/8.5, Lighthouse on 8.4. The step prints its time (and writes it to the summary).
    name: ${{ matrix.suite }} (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    # the PHP side runs in a zone with summer time while the MySQL service stays in UTC: a test (or code) that mixes
    # MySQL's NOW() with what PHP wrote with date() fails every run, not only around midnight (INV-36)
    env: { TZ: Europe/Prague }
    strategy:
      fail-fast: false
      matrix:
        # smoke = tools/test.sh (clean install and a pass through the pages), english = no Czech in the English admin,
        # demo = demo mode, snapshot and the hourly reset, browser = admin, builder, editors and the public site in Chrome
        suite: [smoke, english, demo, browser]
        php: ['8.3', '8.4', '8.5'] # 8.3 = KALETA_MIN_PHP, the oldest supported (3.7): it runs the HTML5 DOM from system/compat
        include:
          # setup-php turns on opcache.jit = 1235 (per function on hot counters): on 8.3 that mode crashes PHP on builder pages after a
          # while – an engine bug of 8.3 that Health::riskyJit() reports on a site. 8.3 runs with PHP's default tracing JIT instead.
          - { php: '8.3', jit: tracing }
          # the output budget (Lighthouse on every starter site) on 8.4 only, as before the split
          - { suite: lighthouse, php: '8.4' }
    services:
      mysql:
        image: mysql:8.4
        env: { MYSQL_ROOT_PASSWORD: root }
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with: { php-version: '${{ matrix.php }}', extensions: 'pdo_mysql, mbstring, gd, zip, sodium, intl, exif', coverage: none, ini-values: "date.timezone=Europe/Prague${{ matrix.jit && format(', opcache.jit={0}', matrix.jit) || '' }}" }
      - name: ${{ matrix.suite }}
        env: { DB_HOST: 127.0.0.1, DB_USER: root, DB_PASS: root, CHROME: /usr/bin/google-chrome, SUITE: '${{ matrix.suite }}', KALETA_CI_PHP: '${{ matrix.php }}' }
        run: |
          case "$SUITE" in
            smoke) script=tools/test.sh ;;
            english|demo|browser|lighthouse) script="tools/test-$SUITE.sh" ;;
            *) echo "unknown suite $SUITE"; exit 1 ;;
          esac
          start=$(date +%s)
          trap 'took=$(( $(date +%s) - start )); printf "%s on PHP %s: %dm %02ds\n" "$SUITE" "$KALETA_CI_PHP" $((took / 60)) $((took % 60)) | tee -a "$GITHUB_STEP_SUMMARY"' EXIT
          "$script"
  migrace:
    # aktualizace databáze starší verze na současnou (tools/test-migrations.sh) na MySQL i MariaDB, jaké mívají hostingy
    runs-on: ubuntu-latest
    env: { TZ: Europe/Prague } # PHP in a zone with summer time, the database in UTC (see the test job)
    strategy:
      fail-fast: false
      matrix:
        db:
          - { image: 'mysql:8.4', health: 'mysqladmin ping -proot' }
          - { image: 'mariadb:10.6', health: 'healthcheck.sh --connect --innodb_initialized' }
          - { image: 'mariadb:11.4', health: 'healthcheck.sh --connect --innodb_initialized' }
    services:
      db:
        image: ${{ matrix.db.image }}
        env: { MYSQL_ROOT_PASSWORD: root, MARIADB_ROOT_PASSWORD: root }
        ports: ['3306:3306']
        options: --health-cmd="${{ matrix.db.health }}" --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with: { php-version: '8.4', extensions: 'pdo_mysql, mbstring, gd, intl, zip, sodium', coverage: none, ini-values: date.timezone=Europe/Prague }
      - name: Aktualizace databáze z 1.0.0 na současnou verzi
        run: tools/test-migrations.sh
        env: { DB_HOST: 127.0.0.1, DB_USER: root, DB_PASS: root, FROM: v1.0.0 }
      - name: Update from the previous release through the admin
        run: tools/test-update.sh
        env: { DB_HOST: 127.0.0.1, DB_USER: root, DB_PASS: root }
      - name: Update from 1.0.0 through the admin
        run: tools/test-update.sh
        env: { DB_HOST: 127.0.0.1, DB_USER: root, DB_PASS: root, FROM: v1.0.0 }
  phpstan:
    # static analysis (phpstan.neon.dist): level 6 against PHP 8.3, the oldest supported (3.7); the findings of 2.1.0 in phpstan-baseline.neon – new code adds none.
    # 3.45 (Q11, T6): the templates too (phpstan-views.neon.dist, level 2); the count at level 8 is reported by phpstan-level8 below, not blocking
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with: { php-version: '8.4', extensions: 'pdo_mysql, mbstring, gd, zip, sodium, intl, exif', coverage: none }
      - name: Download PHPStan
        # T1 (Q12): the download is checked against the digest of the release asset (GitHub's sha256 of 2.1.30) – to update,
        # change the version and the digest together here and in phpstan-level8 (gh api repos/phpstan/phpstan/releases/tags/<version>, assets[].digest)
        run: |
          curl -sSL -o /tmp/phpstan.phar https://github.com/phpstan/phpstan/releases/download/2.1.30/phpstan.phar
          echo "9b75057f287c127c257ae0cdfce36b82b5fe75f40114de9ed8f2e6a0b03e8100  /tmp/phpstan.phar" | sha256sum -c -
      - name: PHPStan (level 6)
        run: php -d memory_limit=2G /tmp/phpstan.phar analyse -c phpstan.neon.dist --no-progress
      - name: PHPStan – templates (level 2)
        run: php -d memory_limit=2G /tmp/phpstan.phar analyse -c phpstan-views.neon.dist --no-progress
  phpstan-level8:
    # 3.45 (Q11, T6): how far the code is from level 8 – a number in the job summary, never a red build (the job always passes)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with: { php-version: '8.4', extensions: 'pdo_mysql, mbstring, gd, zip, sodium, intl, exif', coverage: none }
      - name: PHPStan level 8 (report only)
        run: |
          curl -sSL -o /tmp/phpstan.phar https://github.com/phpstan/phpstan/releases/download/2.1.30/phpstan.phar
          echo "9b75057f287c127c257ae0cdfce36b82b5fe75f40114de9ed8f2e6a0b03e8100  /tmp/phpstan.phar" | sha256sum -c -
          php -d memory_limit=2G /tmp/phpstan.phar analyse -c phpstan.neon.dist --level=8 --no-progress --error-format=json > /tmp/level8.json || true
          php -r '$r = json_decode((string) file_get_contents("/tmp/level8.json"), true); $by = [];
            foreach ($r["files"] ?? [] as $f) { foreach ($f["messages"] as $m) { $by[$m["identifier"] ?? "other"] = ($by[$m["identifier"] ?? "other"] ?? 0) + 1; } }
            arsort($by); $top = implode(", ", array_map(fn ($k, $v) => "$k $v", array_keys($by), $by));
            echo "PHPStan level 8 (same rules as the level 6 gate): " . (is_array($r) ? ($r["totals"]["file_errors"] ?? "?") . " findings – " . implode(", ", array_slice(explode(", ", $top), 0, 8)) : "no result") . PHP_EOL;' | tee -a "$GITHUB_STEP_SUMMARY"
  guards:
    # T1 (Q12): cheap checks that need no database – every JavaScript file parses, and no migration number is duplicated or
    # merged below one the previous release shipped (tools/check-migrations.php compares with the newest v* tag)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with: { php-version: '8.4', coverage: none }
      - name: JavaScript syntax (node --check)
        run: git ls-files -z '*.js' '*.mjs' | xargs -0 -n1 node --check
      - name: Migration numbers
        run: php tools/check-migrations.php
  bezpecnost:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      # the scanner images are pinned by digest (INV-35): a new upstream release must not turn main red without a change of ours;
      # to update, resolve the digest of the new version tag and change it here and in denni-kontrola.yml together
      - name: Semgrep - bezpečnostní pravidla pro PHP a JavaScript
        # přímo program v kontejneru: zastaralá akce semgrep-action už neumí číst současná pravidla z registru (2.10)
        run: docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:1.179.0@sha256:93963d9295a366f59e4850127b1550400ee7b388f04fe144e4a1f6325d96e01b semgrep scan --config p/php --config p/javascript --config p/secrets --config p/owasp-top-ten --error --metrics=off --quiet
      - name: Gitleaks - v repozitáři nesmí být klíče ani hesla
        # přímo program: hotová akce gitleaks-action chce u organizací placenou licenci
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f detect --source /repo --redact --no-banner --verbose
      - name: Soukromý klíč vydavatele není v gitu
        run: '! git ls-files | grep -E "tools/klice|\.key$"'
