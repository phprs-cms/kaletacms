# Kontrola každé změny: syntaxe a kouřový test na podporovaných verzích PHP, bezpečnostní statická analýza,
# hlídání tajemství v repozitáři. Jednou týdně běží i bez změn - odhalí problém s novou verzí PHP nebo MySQL.
name: Kontrola
on:
  push:
  pull_request:
  schedule:
    - cron: '17 4 * * 1'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    # the PHP side runs in a zone with summer time while the MySQL service stays in UTC: a test (or code) that mixes
    # MySQL's NOW() with what PHP wrote with date() fails every run, not only around midnight (INV-36)
    env: { TZ: Europe/Prague }
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5'] # 8.3 = KALETA_MIN_PHP, the oldest supported (3.7): it runs the HTML5 DOM from system/compat
        # setup-php turns on opcache.jit = 1235 (per function on hot counters): on 8.3 that mode crashes PHP on builder pages after a
        # while – an engine bug of 8.3 that Health::riskyJit() reports on a site. 8.3 runs with PHP's default tracing JIT instead.
        include:
          - { php: '8.3', jit: tracing }
    services:
      mysql:
        image: mysql:8.4
        env: { MYSQL_ROOT_PASSWORD: root }
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with: { php-version: '${{ matrix.php }}', extensions: 'pdo_mysql, mbstring, gd, zip, sodium, intl, exif', coverage: none, ini-values: "date.timezone=Europe/Prague${{ matrix.jit && format(', opcache.jit={0}', matrix.jit) || '' }}" }
      - name: Kouřový test (čistá instalace a průchod stránkami)
        run: tools/test.sh
        env: { DB_HOST: 127.0.0.1, DB_USER: root, DB_PASS: root }
      - name: Anglická administrace bez češtiny
        run: tools/test-english.sh
        env: { DB_HOST: 127.0.0.1, DB_USER: root, DB_PASS: root }
      - name: Public demo (demo mode, snapshot and the hourly reset)
        run: tools/test-demo.sh
        env: { DB_HOST: 127.0.0.1, DB_USER: root, DB_PASS: root }
      - name: Browser test (admin, builder, editors, public site in Chrome)
        run: tools/test-browser.sh
        env: { DB_HOST: 127.0.0.1, DB_USER: root, DB_PASS: root, CHROME: /usr/bin/google-chrome }
      - name: Output budget (Lighthouse on every starter site)
        if: matrix.php == '8.4'
        run: tools/test-lighthouse.sh
        env: { DB_HOST: 127.0.0.1, DB_USER: root, DB_PASS: root, CHROME: /usr/bin/google-chrome }
  migrace:
    # aktualizace databáze starší verze na současnou (tools/test-migrations.sh) na MySQL i MariaDB, jaké mívají hostingy
    runs-on: ubuntu-latest
    env: { TZ: Europe/Prague } # PHP in a zone with summer time, the database in UTC (see the test job)
    strategy:
      fail-fast: false
      matrix:
        db:
          - { image: 'mysql:8.4', health: 'mysqladmin ping -proot' }
          - { image: 'mariadb:10.6', health: 'healthcheck.sh --connect --innodb_initialized' }
          - { image: 'mariadb:11.4', health: 'healthcheck.sh --connect --innodb_initialized' }
    services:
      db:
        image: ${{ matrix.db.image }}
        env: { MYSQL_ROOT_PASSWORD: root, MARIADB_ROOT_PASSWORD: root }
        ports: ['3306:3306']
        options: --health-cmd="${{ matrix.db.health }}" --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with: { php-version: '8.4', extensions: 'pdo_mysql, mbstring, gd, intl, zip, sodium', coverage: none, ini-values: date.timezone=Europe/Prague }
      - name: Aktualizace databáze z 1.0.0 na současnou verzi
        run: tools/test-migrations.sh
        env: { DB_HOST: 127.0.0.1, DB_USER: root, DB_PASS: root, FROM: v1.0.0 }
      - name: Update from the previous release through the admin
        run: tools/test-update.sh
        env: { DB_HOST: 127.0.0.1, DB_USER: root, DB_PASS: root }
      - name: Update from 1.0.0 through the admin
        run: tools/test-update.sh
        env: { DB_HOST: 127.0.0.1, DB_USER: root, DB_PASS: root, FROM: v1.0.0 }
  phpstan:
    # static analysis (phpstan.neon.dist): level 5 against PHP 8.3, the oldest supported (3.7); the findings of 2.1.0 in phpstan-baseline.neon – new code adds none
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # v2
        with: { php-version: '8.4', extensions: 'pdo_mysql, mbstring, gd, zip, sodium, intl, exif', coverage: none }
      - name: PHPStan
        run: |
          curl -sSL -o /tmp/phpstan.phar https://github.com/phpstan/phpstan/releases/download/2.1.30/phpstan.phar
          php -d memory_limit=2G /tmp/phpstan.phar analyse -c phpstan.neon.dist --no-progress
  bezpecnost:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      # the scanner images are pinned by digest (INV-35): a new upstream release must not turn main red without a change of ours;
      # to update, resolve the digest of the new version tag and change it here and in denni-kontrola.yml together
      - name: Semgrep - bezpečnostní pravidla pro PHP a JavaScript
        # přímo program v kontejneru: zastaralá akce semgrep-action už neumí číst současná pravidla z registru (2.10)
        run: docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:1.179.0@sha256:93963d9295a366f59e4850127b1550400ee7b388f04fe144e4a1f6325d96e01b semgrep scan --config p/php --config p/javascript --config p/secrets --config p/owasp-top-ten --error --metrics=off --quiet
      - name: Gitleaks - v repozitáři nesmí být klíče ani hesla
        # přímo program: hotová akce gitleaks-action chce u organizací placenou licenci
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f detect --source /repo --redact --no-banner --verbose
      - name: Soukromý klíč vydavatele není v gitu
        run: '! git ls-files | grep -E "tools/klice|\.key$"'
