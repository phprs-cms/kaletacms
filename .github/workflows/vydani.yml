# Vydání: tag vX.Y.Z spustí testy a založí KONCEPT vydání na GitHubu.
# Balíček se tady nepodepisuje – soukromý klíč nepatří do CI (docs/RELEASING.md). Vydavatel pak lokálně spustí
#   php tools/release.php X.Y.Z --url=https://github.com/phprs-cms/kaletacms/releases/download/vX.Y.Z/kaleta-X.Y.Z.zip --zmena="…"
# nahraje dist/kaleta-X.Y.Z.zip ke konceptu (gh release upload vX.Y.Z dist/kaleta-X.Y.Z.zip), koncept zveřejní
# a dist/aktualizace.json vystaví na https://kaletacms.com/aktualizace.json.
name: Vydání

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  koncept:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env: { MYSQL_ROOT_PASSWORD: root }
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -proot" --health-interval=5s --health-timeout=5s --health-retries=20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
        with: { php-version: '8.4', extensions: 'pdo_mysql, mbstring, gd, intl, zip, sodium', coverage: none }
      - name: Verze v kódu odpovídá tagu
        run: grep -q "const KALETA_VERSION = '${GITHUB_REF_NAME#v}';" system/bootstrap.php
      - name: Testy
        env: { DB_HOST: 127.0.0.1, DB_USER: root, DB_PASS: root }
        run: tools/test.sh
      - name: Aktualizace databáze z předchozích vydání
        env: { DB_HOST: 127.0.0.1, DB_USER: root, DB_PASS: root, FROM: v1.0.0 }
        run: tools/test-migrations.sh
      - name: Update from the previous release through the admin
        env: { DB_HOST: 127.0.0.1, DB_USER: root, DB_PASS: root }
        run: tools/test-update.sh
      - name: Koncept vydání
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with: { draft: true, generate_release_notes: true }
